<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Taschenlampen Suchspiel</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      cursor: none;
      background: url("Unterwasser.png") center/cover no-repeat;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      background: black;

      mask-image: radial-gradient(
        circle 140px at var(--x, 50%) var(--y, 50%),
        transparent 0%,
        transparent 30%,
        black 31%
      );

      -webkit-mask-image: radial-gradient(
        circle 140px at var(--x, 50%) var(--y, 50%),
        transparent 0%,
        transparent 30%,
        black 31%
      );
    }

    .dark-overlay.off {
      opacity: 0;
    }

    .flashlight {
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      left: var(--x);
      top: var(--y);

      box-shadow:
        0 0 8px white,
        0 0 30px rgba(255,255,255,0.8),
        0 0 80px rgba(255,255,255,0.3);
    }

    .flashlight.off {
      opacity: 0;
    }

    /* 🔎 Bild-Objekte */
    .item {
      position: absolute;
      width: 70px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      cursor: pointer;
      filter: brightness(0.6);
    }

    .item.found {
      opacity: 1 !important;
      transform: scale(1.2);
      filter: brightness(1.2);
    }

    /* 🔌 Schalter */
    .switch {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 100px;
      background: #eee;
      border-radius: 10px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.3),
                  0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toggle {
      width: 20px;
      height: 50px;
      background: #ccc;
      border-radius: 5px;
      transition: transform 0.2s;
    }

    .switch.on .toggle {
      transform: translateY(-10px);
    }

  </style>
</head>

<body>

  <div class="container" id="flashlight">

    <div class="dark-overlay" id="overlay"></div>
    <div class="flashlight" id="light"></div>

    <div class="switch" id="switch">
      <div class="toggle"></div>
    </div>

  </div>

  <script>
    const container = document.getElementById("flashlight");
    const overlay = document.getElementById("overlay");
    const light = document.getElementById("light");
    const switchBtn = document.getElementById("switch");
    const items = document.querySelectorAll(".item");

    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;
    let isLightOn = false;

    container.addEventListener("mousemove", (e) => {
      const rect = container.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    function animate() {
      currentX += (mouseX - currentX) * 0.15;
      currentY += (mouseY - currentY) * 0.15;

      container.style.setProperty("--x", currentX + "px");
      container.style.setProperty("--y", currentY + "px");

      checkItems();

      requestAnimationFrame(animate);
    }

    animate();

    /* 🔌 Lichtschalter */
    switchBtn.addEventListener("click", () => {
      isLightOn = !isLightOn;
      overlay.classList.toggle("off", isLightOn);
      light.classList.toggle("off", isLightOn);
      switchBtn.classList.toggle("on", isLightOn);
    });

    /* 🔎 Sichtbarkeit */
    function checkItems() {
      items.forEach(item => {
        const rect = item.getBoundingClientRect();
        const dx = currentX - (rect.left + rect.width / 2);
        const dy = currentY - (rect.top + rect.height / 2);
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 110) {
          item.style.opacity = 0.9;
        } else if (!item.classList.contains("found")) {
          item.style.opacity = 0;
        }
      });
    }

    /* 🖱️ Klick */
    items.forEach(item => {
      item.addEventListener("click", () => {
        item.classList.add("found");
        alert(item.dataset.name + " gefunden!");
      });
    });

  </script>

</body>
</html>
